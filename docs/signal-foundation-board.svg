<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <rect width="1280" height="900" fill="#f5f2ec"/>
  <style>text{font-family:Arial,sans-serif;fill:#16253b}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;fill:#2450c8}.title{font-size:48px;font-weight:700;letter-spacing:-2px}.subtitle{font-size:18px;fill:#455468}.section{font-size:18px;font-weight:700}.label{font-size:15px;font-weight:700}.small{font-size:12px;fill:#455468}</style>
  <text x="64" y="64" class="eyebrow">SIGNAL / FIGMA FOUNDATION BOARD</text>
  <text x="64" y="121" class="title">Small by design. Useful by default.</text>
  <text x="64" y="155" class="subtitle">A compact visual system for the Northstar team operations product.</text>
  <text x="64" y="214" class="section">01  Colour and interaction</text>
  <g transform="translate(64,235)">
    <rect width="220" height="120" rx="12" fill="#f5f2ec" stroke="#cdd5dd"/><text x="18" y="74" class="label">Canvas</text><text x="18" y="98" class="small">#F5F2EC</text>
    <rect x="235" width="220" height="120" rx="12" fill="#16253b"/><text x="253" y="74" class="label" fill="white" style="fill:white">Ink</text><text x="253" y="98" class="small" style="fill:white">#16253B</text>
    <rect x="470" width="220" height="120" rx="12" fill="#2450c8"/><text x="488" y="74" class="label" style="fill:white">Action</text><text x="488" y="98" class="small" style="fill:white">#2450C8</text>
    <rect x="705" width="220" height="120" rx="12" fill="#eaf6ed"/><text x="723" y="74" class="label">Success</text><text x="723" y="98" class="small">#EAF6ED</text>
    <rect x="940" width="220" height="120" rx="12" fill="#fff0ef"/><text x="958" y="74" class="label">Error</text><text x="958" y="98" class="small">#FFF0EF</text>
  </g>
  <text x="64" y="413" class="section">02  Type and spacing</text>
  <rect x="64" y="434" width="560" height="126" rx="12" fill="white" stroke="#dfe4e8"/>
  <text x="88" y="476" font-size="29" font-weight="700">Manrope / headings</text><text x="88" y="514" font-size="17" fill="#455468">DM Sans / readable interface copy</text><text x="88" y="539" class="small">Fallback: Arial or system sans-serif</text>
  <rect x="640" y="434" width="576" height="126" rx="12" fill="white" stroke="#dfe4e8"/>
  <text x="664" y="469" class="label">Spacing scale</text><text x="664" y="504" font-size="20" font-weight="700">4  ·  8  ·  12  ·  16  ·  24  ·  32  ·  48</text><text x="664" y="537" class="small">Focus: 3px #F39C54 ring with 3px offset</text>
  <text x="64" y="616" class="section">03  Component examples</text>
  <rect x="64" y="637" width="1152" height="195" rx="12" fill="white" stroke="#dfe4e8"/>
  <rect x="88" y="667" width="185" height="48" rx="8" fill="#2450c8"/><text x="120" y="698" font-size="15" font-weight="700" style="fill:white">Primary action</text>
  <rect x="288" y="667" width="150" height="48" rx="8" fill="#f1f4f8" stroke="#d9e0e9"/><text x="314" y="698" font-size="15" font-weight="700">Secondary</text>
  <text x="464" y="684" class="small">Email address</text><rect x="464" y="693" width="255" height="44" rx="7" fill="white" stroke="#cdd6df"/><text x="476" y="720" class="small">name@example.com</text>
  <rect x="756" y="675" width="21" height="21" rx="4" fill="#2450c8"/><path d="m762 686 4 4 7-9" fill="none" stroke="white" stroke-width="2"/><text x="788" y="692" class="label">Project updates</text><text x="788" y="713" class="small">Changes on projects you follow</text>
  <rect x="88" y="752" width="530" height="57" rx="8" fill="#eaf6ed" stroke="#c9e7d2"/><text x="109" y="776" class="label">✓  Invitation sent</text><text x="131" y="795" class="small">Alex can now join the workspace.</text>
  <rect x="640" y="752" width="552" height="57" rx="8" fill="#fff0ef" stroke="#f2d0cb"/><text x="661" y="776" class="label">!  Invitation not sent</text><text x="683" y="795" class="small">Your details are still here. Please try again.</text>
  <text x="64" y="867" class="small">Figma handoff: import this SVG as a visual reference, then rebuild the five components as native Figma components with variants.</text>
</svg>
